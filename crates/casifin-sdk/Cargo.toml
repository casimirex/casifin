[package]
name = "casifin-sdk"
version = "0.1.0"
edition = "2021"
authors = ["casifin contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourorg/casifin"

[dependencies]
casifin-core = { path = "../casifin-core" }
casifin-tvm = { path = "../casifin-tvm" }
casifin-cashflow = { path = "../casifin-cashflow" }
casifin-amortization = { path = "../casifin-amortization" }
casifin-ratios = { path = "../casifin-ratios" }
casifin-depreciation = { path = "../casifin-depreciation" }
casifin-inventory = { path = "../casifin-inventory" }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }

[features]
default = ["std"]
std = []
serde = ["dep:serde", "casifin-core/serde"]
