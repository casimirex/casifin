[package]
name = "casifin-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
casifin-core = { path = "../casifin-core" }
casifin-tvm = { path = "../casifin-tvm" }
casifin-cashflow = { path = "../casifin-cashflow" }
casifin-amortization = { path = "../casifin-amortization" }
casifin-ratios = { path = "../casifin-ratios" }
casifin-depreciation = { path = "../casifin-depreciation" }
casifin-inventory = { path = "../casifin-inventory" }
rust_decimal = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }

[features]
default = ["std"]
std = []
serde = ["dep:serde", "casifin-core/serde"]
